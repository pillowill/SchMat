# MP-20 full-cell HDS ablation: preserve complete HDS/codebook lookup, then
# expose only the global semantic branch to the diffusion decoder.

wandb:
  project: cond_diffusion
  run_name: mp_20_fullcell_e2_global_only_hds_3090b

# Dataset and loaders
use_single_csv: false
data_path: dataset/mp_20
train_csv: train.csv
val_csv: val.csv
test_csv: test.csv
return_test: false
property: band_gap
random_seed: 42
train_batch_size: 128
val_batch_size: 128
test_batch_size: 128
workers: 0
pin_memory: true

# Full-cell k=256 alpha-weighted Attn-RVQ and parsed HDS conditions
pretrained_vqvae_path: experiments/mp_20/k256_lr3e-4_fullcell_attn_rvq/checkpoints/best_model.pth
pretrained_vqvae_config: config/attn_rvq/train_cryvqvae_mp_20_k256_lr3e-4.yaml
use_gpt_precomputed_vq_vectors: false
gpt_indices_path_train: null
gpt_indices_path_val: null
gpt_indices_path_test: null
gpt_indices_dir: dataset/mp_20/DSS2indices
filter_skipped_ids_before_training: false
direct_indices_path_train: experiments/mp_20/k256_lr3e-4_fullcell_cond_diffusion_hds/conditions/direct_train_indices.pkl.gz
direct_indices_path_val: experiments/mp_20/k256_lr3e-4_fullcell_cond_diffusion_hds/conditions/direct_val_indices.pkl.gz
predicted_indices_path_train: experiments/mp_20/k256_lr3e-4_fullcell_cond_diffusion_hds/conditions/predicted_rank0_train_indices.pkl.gz
predicted_indices_path_val: experiments/mp_20/k256_lr3e-4_fullcell_cond_diffusion_hds/conditions/predicted_rank0_val_indices.pkl.gz
predicted_hds_ratio: 1.0
predicted_hds_candidate_rank: 0
hds_mix_seed: 42
validation_hds_source: predicted

# Fixed-length optimization used by the 3090B ablation study
learning_rate: 1.0e-3
weight_decay: 0.0
min_lr: 1.0e-7
num_epochs: 500
grad_clip: 1.0
finetune_vqvae_outer_aggregator: false
vqvae_outer_agg_lr: 1.0e-6
finetune_vqvae_inner_aggregator: false
vqvae_inner_agg_lr: 5.0e-7
scheduler: cosine
cosine_T_max: null
early_stopping: false
early_stopping_patience: null
save_every: 500

# Diffusion process and classifier-free guidance
timesteps: 1000
beta_schedule: cosine
diffuse_atom_types: false
max_atoms: 104
d3pm_hybrid_coeff: 1.0
cond_guide: true
cond_drop_prob: 0.1

# Property conditioning is disabled for unconditional MP-20 CSP
property_cond_enabled: false
property_vocab_size: 12
property_emb_dim: 128
property_fusion_mode: mean
property_cond_drop_prob: 0.2
property_pred_weight: 1.0

# CSPNet and the HDS branch ablation
time_dim: 512
hidden_dim: 512
cond_dim: 512
num_layers: 6
act_fn: silu
dis_emb: sin
num_freqs: 128
edge_style: fc
cutoff: 6.0
max_neighbors: 20
ln: true
ip: true
smooth: false
pred_atom_types: false
use_multiscale_film: true
local_film_end_layer: 2
global_film_start_layer: 3
hds_condition_mode: global_only

# Loss weights
cost_atom_types: 1.0
cost_lattice: 1.0
cost_coords: 1.0
