# MPTS-52 conditional diffusion using the E2 canonical HDS conditions.
# The predicted HDS files are generated from the five-candidate E2 model;
# training and validation use only canonical candidate rank 0 per structure.

wandb:
  project: cond_diffusion
  run_name: mpts_52_e2_hds_multiscale_film

# Dataset and loaders
use_single_csv: false
data_path: dataset/mpts_52
train_csv: train.csv
val_csv: val.csv
test_csv: test.csv
return_test: false
property: formation_energy
random_seed: 42
train_batch_size: 64
val_batch_size: 128
test_batch_size: 128
workers: 0
pin_memory: true

# The k=256 Attn-RVQ model used to encode HDS VQ indices.
pretrained_vqvae_path: experiments/mpts_52/k256_lr3e-4_attn_rvq_b64_restart/checkpoints/best_model.pth
pretrained_vqvae_config: config/attn_rvq/train_cryvqvae_mpts_52_k256_lr3e-4.yaml
aggregator_attn_dropout: 0.2
aggregator_use_positional: true
aggregator_positional_scale: 1.0
use_gpt_precomputed_vq_vectors: false
gpt_indices_path_train: null
gpt_indices_path_val: null
gpt_indices_path_test: null
gpt_indices_dir: null
filter_skipped_ids_before_training: false

# Direct HDS is extracted from the structure; predicted HDS comes from the E2
# generator.  One source is drawn per training ID per epoch.  Validation is
# intentionally fixed to predicted canonical rank 0 for stable, deployment-like
# model selection across the mixture-ratio experiments.
direct_indices_path_train: experiments/mpts_52/k256_lr3e-4_cond_diffusion_hds/conditions/direct_train_indices.pkl.gz
direct_indices_path_val: experiments/mpts_52/k256_lr3e-4_cond_diffusion_hds/conditions/direct_val_indices.pkl.gz
predicted_indices_path_train: experiments/mpts_52/k256_lr3e-4_cond_diffusion_hds/conditions/predicted_rank0_train_indices.pkl.gz
predicted_indices_path_val: experiments/mpts_52/k256_lr3e-4_cond_diffusion_hds/conditions/predicted_rank0_val_indices.pkl.gz
predicted_hds_ratio: 0.0
predicted_hds_candidate_rank: 0
hds_mix_seed: 42
validation_hds_source: predicted

# Optimisation
learning_rate: 3.0e-4
weight_decay: 1.0e-6
min_lr: 1.0e-7
num_epochs: 3000
grad_clip: 1.0
finetune_vqvae_aggregator: false
vqvae_agg_lr: 1.0e-6
scheduler: cosine
cosine_T_max: null
plateau_mode: min
plateau_factor: 0.5
plateau_patience: 10
plateau_threshold: 1.0e-4
plateau_cooldown: 0
step_size: 30
step_gamma: 0.1
early_stopping: true
early_stopping_patience: 200
early_stopping_min_delta: 1.0e-4
early_stopping_mode: min
save_every: 500

# Diffusion process and classifier-free conditioning
timesteps: 1000
beta_schedule: cosine
diffuse_atom_types: false
max_atoms: 104
d3pm_hybrid_coeff: 1.0
cond_guide: true
cond_drop_prob: 0.1

# CSPNet decoder and HDS conditioning architecture
time_dim: 512
hidden_dim: 512
cond_dim: 512
num_layers: 6
act_fn: silu
dis_emb: sin
num_freqs: 128
edge_style: fc
cutoff: 6.0
max_neighbors: 20
ln: true
ip: true
smooth: false
pred_atom_types: false
use_multiscale_film: true

# Loss weights
cost_atom_types: 1.0
cost_lattice: 1.0
cost_coords: 1.0
